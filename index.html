
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoltMarket GH | Electronics Marketplace</title>
  <meta name="description" content="Discover phones, laptops, gaming gear and electronics in Ghana.">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }
    header {
      background: #101827;
      color: white;
      padding: 22px 16px;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #cbd5e1; }
    main { padding: 20px 16px; max-width: 900px; margin: auto; }
    input, button {
      box-sizing: border-box;
      padding: 13px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { width: 100%; border: 1px solid #cbd5e1; }
    .categories { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    .categories span { background: white; padding: 10px; border-radius: 8px; }
    #status { color: #475569; }
  </style>
</head>
<body>
  <header>
    <h1>VoltMarket GH</h1>
    <p>Ghana's marketplace for electronics.</p>
  </header>
  <main>
    <h2>Find your next device</h2>
    <input type="search" placeholder="Search phones, laptops, gaming gear...">
    <div class="categories">
      <span>📱 Phones & Tablets</span>
      <span>💻 Laptops</span>
      <span>🎮 Gaming</span>
      <span>📺 TVs & Displays</span>
      <span>🎧 Audio</span>
      <span>📷 Cameras</span>
      <span>⌚ Smart Devices</span>
      <span>🔌 Accessories</span>
    </div>
    <h2>Marketplace</h2>
    <p id="status">Website setup in progress.</p>
  </main>
</body>
</html>
